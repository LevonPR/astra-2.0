name: Register Loki66 Agent Beacon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/register-a2a-registry.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate public Agent Card
        shell: bash
        run: |
          set -euo pipefail
          CARD="https://loki66-agent-beacon.onrender.com/.well-known/agent-card.json"
          curl --fail --silent --show-error --max-time 30 "$CARD" -o card.json
          python - <<'PY'
          import json
          card=json.load(open("card.json"))
          assert card.get("name") == "Loki66 Rendezvous", card
          interfaces=card.get("supportedInterfaces") or []
          assert any(
              i.get("protocolBinding") == "JSONRPC"
              and i.get("url") == "https://loki66-agent-beacon.onrender.com/a2a"
              for i in interfaces
          ), interfaces
          assert "localhost" not in json.dumps(card).lower(), card
          print("Agent Card healthy:", card.get("name"), card.get("version"))
          PY

      - name: Inspect A2A Registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          URL="https://a2aregistry.org/api/agents?search=Loki66&limit=100"
          if ! curl --fail --silent --show-error --max-time 30 "$URL" -o registry.json; then
            echo "needs_refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json, os
          data=json.load(open("registry.json"))
          raw=json.dumps(data)
          present="loki66-agent-beacon.onrender.com" in raw.lower()
          stale="localhost:10000" in raw.lower()
          unhealthy='"is_healthy": false' in raw.lower() or '"passed": false' in raw.lower()
          needs=(not present) or stale or unhealthy
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("needs_refresh=" + ("true" if needs else "false") + "\n")
          print("present=",present,"stale=",stale,"unhealthy=",unhealthy,"needs_refresh=",needs)
          PY

      - name: Register or refresh with A2A Registry
        if: steps.registry.outputs.needs_refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"wellKnownURI":"https://loki66-agent-beacon.onrender.com/.well-known/agent-card.json"}'
          code=$(curl --silent --show-error --max-time 45 \
            -o register-response.json \
            -w "%{http_code}" \
            -X POST "https://a2aregistry.org/api/agents/register" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Loki66-Agent-Beacon/1.3" \
            -d "$BODY")

          cat register-response.json || true
          echo
          echo "HTTP status: $code"

          case "$code" in
            200|201|202|204|409) exit 0 ;;
            *) exit 1 ;;
          esac
