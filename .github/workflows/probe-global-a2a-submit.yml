name: Probe Global A2A Submit Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-global-a2a-submit.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live submit application bundles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import urllib.request
          import urllib.parse

          base = "https://www.a2a-registry.org"
          page = base + "/submit"
          req = urllib.request.Request(page, headers={"User-Agent":"Loki66-Agent-Beacon-Probe/1.0"})
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8","replace")
          print("submit_html_bytes", len(html))

          srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I)
          srcs = list(dict.fromkeys(srcs))
          print("script_count", len(srcs))

          patterns = [
              re.compile(r'.{0,220}(?:public/ingest|/ingest|manifestUrl|agentCardUrl|agentUrl|submitAgent|scanAgent|registerAgent|/api/[^"\'\s\\]+).{0,320}', re.I | re.S),
          ]

          hits = []
          for src in srcs[:80]:
              url = urllib.parse.urljoin(page, src)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Loki66-Agent-Beacon-Probe/1.0"})
                  data = urllib.request.urlopen(req, timeout=30).read().decode("utf-8","replace")
              except Exception as e:
                  print("FETCH_FAIL", url, repr(e))
                  continue
              for pat in patterns:
                  for m in pat.finditer(data):
                      snippet = re.sub(r'\s+', ' ', m.group(0))
                      key = (url, snippet)
                      if key not in hits:
                          hits.append(key)

          print("MATCHES", len(hits))
          for url, snippet in hits[:120]:
              print("\nBUNDLE", url)
              print(snippet[:1200])
          PY
